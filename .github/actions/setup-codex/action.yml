name: Setup Codex account
description: Prepare an unprivileged Linux account for openai/codex-action.

runs:
  using: composite
  steps:
    - name: Prepare account and checkout permissions
      shell: bash
      run: |
        set -euo pipefail

        runner_user="$(id -un)"
        runner_group="$(id -gn)"

        sudo adduser --system --home /home/codex --shell /bin/bash --group codex
        sudo usermod -a -G codex "$runner_user"
        sudo usermod -a -G "$runner_group" codex

        sudo chown -R "$runner_user:codex" "$GITHUB_WORKSPACE"
        sudo chmod -R g+rwX "$GITHUB_WORKSPACE"
        sudo find "$GITHUB_WORKSPACE" -type d -exec chmod g+s {} +

        # The PR checkout remains runner-owned; permit Codex to inspect its Git history.
        sudo -u codex git config --global --add safe.directory "$GITHUB_WORKSPACE"
        sudo -u codex test -r "$GITHUB_WORKSPACE/.git/HEAD"
        if sudo -n -u codex -- sudo -n true 2>/dev/null; then
          echo "The Codex account must not have sudo access." >&2
          exit 1
        fi
